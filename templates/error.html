{% extends "base.html" %}

{% block title %}Error {{ error_code }}{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="error-page">
                    <h1 class="display-1 fw-bold text-primary">{{ error_code }}</h1>
                    <h3 class="mb-4">{{ message }}</h3>
                    <p class="text-muted mb-4">
                        Oops! Something went wrong. The page you're looking for might have been moved or doesn't exist.
                    </p>
                    <div class="d-grid gap-2 d-md-block">
                        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
                            <i class="bi bi-house me-2"></i>Back to Home
                        </a>
                        <a href="{{ url_for('shop') }}" class="btn btn-outline-primary btn-lg">
                            <i class="bi bi-shop me-2"></i>Visit Shop
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
