# LOCth Shop - Docker Compose with Nginx Reverse Proxy
# Access the application via http://localhost (Port 80)

version: '3.8'

services:
  web:
    build: .
    container_name: locth-shop-web
    # Port 5000 is NOT exposed to host - only accessible via nginx
    networks:
      - locth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:latest
    container_name: locth-shop-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - locth-network
    restart: unless-stopped

networks:
  locth-network:
    driver: bridge
